<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Campaign social card</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        display: grid;
        grid-template-columns: 1.26fr 0.74fr;
        align-items: center;
        padding: 72px 78px;
        color: #f0f2f3;
        background:
          linear-gradient(rgba(255, 194, 71, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 194, 71, 0.035) 1px, transparent 1px),
          radial-gradient(circle at 82% 48%, rgba(255, 194, 71, 0.13), transparent 34%),
          #080a0f;
        background-size: 28px 28px, 28px 28px, auto, auto;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body::before {
        position: absolute;
        inset: 22px;
        border: 2px solid #ffc247;
        box-shadow: 12px 12px 0 #8a4b08;
        content: "";
      }
      body::after {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(255,255,255,0.018) 3px 4px);
        content: "";
        pointer-events: none;
      }
      main { position: relative; z-index: 2; }
      .eyebrow {
        margin: 0 0 22px;
        color: #ffc247;
        font: 800 20px/1.3 Consolas, monospace;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 690px;
        margin: 0;
        font: 900 80px/0.93 "Arial Black", Impact, sans-serif;
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }
      .goal {
        margin: 28px 0 0;
        color: #c8cdd3;
        font: 700 27px/1.3 "Segoe UI", sans-serif;
      }
      .brand {
        display: inline-flex;
        gap: 14px;
        align-items: center;
        margin-top: 44px;
        font: 900 21px/1 Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .brand-mark {
        display: grid;
        width: 48px;
        height: 48px;
        border: 2px solid #ffc247;
        color: #ffc247;
        place-items: center;
      }
      .emblems {
        position: relative;
        z-index: 2;
        width: 390px;
        height: 390px;
        justify-self: end;
      }
      .emblems img {
        position: absolute;
        top: 45px;
        width: 300px;
        height: 300px;
        object-fit: contain;
        image-rendering: pixelated;
        filter: drop-shadow(12px 16px 0 rgba(0, 0, 0, 0.58));
      }
      .brigade { right: 0; z-index: 1; opacity: 0.78; }
      .skorn { left: -36px; z-index: 2; }
      .unit-label {
        position: absolute;
        right: 2px;
        bottom: 0;
        z-index: 3;
        padding: 12px 16px;
        border: 1px solid #ffc247;
        color: #ffc247;
        background: #11151d;
        font: 900 20px/1 Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Благодійний збір · 65 ОМБр</p>
      <h1>Допомога<br />ЗСУ</h1>
      <p class="goal">Модернізація важкого дрона</p>
      <div class="brand"><span class="brand-mark">ВД</span><span>Важлива деталь</span></div>
    </main>
    <div class="emblems" aria-hidden="true">
      <img class="brigade" src="../brigade_logo-site-style.png" alt="" />
      <img class="skorn" src="../skorn-pixel.png" alt="" />
      <div class="unit-label">Підрозділ SKORN</div>
    </div>
  </body>
</html>
