name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        env:
          CAMPAIGN_COLLECTED_AMOUNT: ${{ vars.CAMPAIGN_COLLECTED_AMOUNT }}
          CAMPAIGN_COLLECTED_DRONES: ${{ vars.CAMPAIGN_COLLECTED_DRONES }}
        run: |
          set -euo pipefail

          amount="${CAMPAIGN_COLLECTED_AMOUNT:-0}"
          drones="${CAMPAIGN_COLLECTED_DRONES:-0}"

          if [[ ! "$amount" =~ ^[0-9]+$ ]]; then
            echo "CAMPAIGN_COLLECTED_AMOUNT must be a non-negative integer."
            exit 1
          fi

          if [[ ! "$drones" =~ ^[0-9]+$ ]]; then
            echo "CAMPAIGN_COLLECTED_DRONES must be a non-negative integer."
            exit 1
          fi

          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

          {
            echo "// Generated by GitHub Actions from repository variables."
            printf 'window.CAMPAIGN_PROGRESS = {\n'
            printf '  collectedAmount: %s,\n' "$amount"
            printf '  collectedDrones: %s,\n' "$drones"
            printf '};\n'
          } > _site/campaign-progress.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
